name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Backend H2 regression
        working-directory: backend
        run: mvn -B -s maven-settings.xml test
      - name: Compose configuration
        env:
          MYSQL_DATABASE: creator
          MYSQL_USER: creator
          MYSQL_PASSWORD: ci-only
          MYSQL_ROOT_PASSWORD: ci-root-only
          RABBITMQ_USER: creator
          RABBITMQ_PASSWORD: ci-mq-only
          STORAGE_ENDPOINT: http://127.0.0.1:9000
          STORAGE_BUCKET: creator-private
          STORAGE_ACCESS_KEY: ci-only
          STORAGE_SECRET_KEY: ci-only
          MEDIA_PUBLIC_ENDPOINT: https://media.example.test
        run: docker compose --env-file /dev/null -f deploy/compose.prod.yml config -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Runtime dependency audit
        working-directory: frontend
        run: npm audit --omit=dev
