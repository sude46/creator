spring:
  application:
    name: creator-platform
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/creator?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:creator}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:8}
      minimum-idle: 1
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: 3000
      max-lifetime: 1800000
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:creator}
    password: ${RABBITMQ_PASSWORD:}
    publisher-confirm-type: correlated
    publisher-returns: true
    dynamic: false
    cache:
      channel:
        size: 4
        checkout-timeout: 5s
  servlet:
    multipart:
      enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 1048576
    max-swallow-size: 2097152
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
creator:
  http:
    max-json-bytes: ${HTTP_MAX_JSON_BYTES:1048576}
  media:
    enabled: ${MEDIA_ENABLED:false}
    public-endpoint: ${MEDIA_PUBLIC_ENDPOINT:}
    region: ${STORAGE_REGION:us-east-1}
    link-seconds: ${MEDIA_LINK_SECONDS:60}
  processing:
    dispatch:
      enabled: ${PROCESSING_DISPATCH_ENABLED:false}
      provider: rabbitmq
      batch-size: ${PROCESSING_DISPATCH_BATCH_SIZE:10}
      confirm-seconds: ${PROCESSING_CONFIRM_SECONDS:5}
      lease-seconds: ${PROCESSING_DISPATCH_LEASE_SECONDS:45}
      redrive-seconds: ${PROCESSING_REDRIVE_SECONDS:600}
      message-ttl-seconds: ${PROCESSING_MESSAGE_TTL_SECONDS:300}
      max-queue-messages: ${PROCESSING_MAX_QUEUE_MESSAGES:1000}
      scan-milliseconds: ${PROCESSING_DISPATCH_SCAN_MS:5000}
      retry-max-seconds: ${PROCESSING_DISPATCH_RETRY_MAX_SECONDS:300}
  upload:
    enabled: ${UPLOAD_ENABLED:false}
    max-concurrent: ${UPLOAD_MAX_CONCURRENT:2}
    max-bytes: ${UPLOAD_MAX_BYTES:209715200}
    temp-directory: ${UPLOAD_TEMP_DIRECTORY:../.local/upload-temp}
    min-free-bytes: ${UPLOAD_MIN_FREE_BYTES:1073741824}
    receive-seconds: ${UPLOAD_RECEIVE_SECONDS:120}
    user-quota-bytes: ${UPLOAD_USER_QUOTA_BYTES:1073741824}
    max-pending: ${UPLOAD_MAX_PENDING:5}
    attempt-seconds: ${UPLOAD_ATTEMPT_SECONDS:900}
  storage:
    provider: minio
    endpoint: ${STORAGE_ENDPOINT:}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    bucket: ${STORAGE_BUCKET:creator-private}
    operation-seconds: ${STORAGE_OPERATION_SECONDS:60}
    incomplete-upload-cleanup: ${STORAGE_INCOMPLETE_UPLOAD_CLEANUP:MINIO_DEFAULT}
  security:
    auth-work:
      max-concurrent: ${AUTH_WORK_MAX_CONCURRENT:2}
      bcrypt-strength: ${AUTH_BCRYPT_STRENGTH:10}
    auth-rate-limit:
      window-seconds: ${AUTH_RATE_WINDOW_SECONDS:60}
      max-attempts: ${AUTH_RATE_MAX_ATTEMPTS:20}
      max-entries: ${AUTH_RATE_MAX_ENTRIES:10000}
  bootstrap:
    admin-username: ${ADMIN_USERNAME:}
    admin-password: ${ADMIN_PASSWORD:}
logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
