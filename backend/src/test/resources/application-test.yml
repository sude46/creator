spring:
  datasource:
    url: jdbc:h2:mem:creator;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;INIT=SET TIME ZONE 'UTC'
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
creator:
  security:
    auth-work:
      max-concurrent: 2
      bcrypt-strength: 10
    auth-rate-limit:
      max-attempts: 1000
  bootstrap:
    admin-username: ""
    admin-password: ""
